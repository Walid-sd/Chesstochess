[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/engine/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/engine/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
